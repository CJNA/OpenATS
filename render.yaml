# Carvis's OpenATS on Render: the API (with the background worker inside it and files on a disk),
# the website, Redis and Postgres, all in Oregon. Deploys from the deploy/carvis branch of the
# CJNA/OpenATS fork. Secrets marked `sync: false` are typed into the Render dashboard once.

envVarGroups:
  - name: openats-mail
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false

databases:
  - name: openats-db
    plan: basic-256mb
    region: oregon
    databaseName: openats
    user: openats
    # Only Render services in this workspace can reach it.
    ipAllowList: []

services:
  - type: keyvalue
    name: openats-redis
    plan: starter
    region: oregon
    # Any other policy lets Redis drop queued jobs silently when it fills up.
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: openats-api
    runtime: node
    plan: starter
    region: oregon
    branch: deploy/carvis
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter ./backend build
    # Migrations and the default stages first (safe on every start), then the API.
    startCommand: cd backend && node dist/src/db/setup.js && node dist/src/server.js
    healthCheckPath: /health
    domains:
      - api.ats.carvis.ai
    # CVs and logos (STORAGE=local). The worker runs inside the API so it can read them too.
    disk:
      name: openats-files
      mountPath: /var/data/openats
      sizeGB: 5
    buildFilter:
      paths:
        - backend/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - fromGroup: openats-mail
      - key: DATABASE_URL
        fromDatabase:
          name: openats-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: openats-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://ats.carvis.ai
      - key: AUTH_ISSUER
        value: https://ats.carvis.ai
      - key: AUTH_JWKS_URL
        value: https://ats.carvis.ai/api/auth/jwks
      # Paraform's sign-in comes back to /oauth/paraform/callback on this address.
      - key: API_PUBLIC_URL
        value: https://api.ats.carvis.ai
      - key: STORAGE
        value: local
      - key: STORAGE_DIR
        value: /var/data/openats
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: TRUST_PROXY
        value: "1"

  - type: web
    name: openats-web
    runtime: node
    plan: starter
    region: oregon
    branch: deploy/carvis
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter ./frontend build
    startCommand: pnpm --filter ./frontend start
    healthCheckPath: /login
    domains:
      - ats.carvis.ai
    buildFilter:
      paths:
        - frontend/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - fromGroup: openats-mail
      - key: DATABASE_URL
        fromDatabase:
          name: openats-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://ats.carvis.ai
      - key: NEXT_PUBLIC_APP_URL
        value: https://ats.carvis.ai
      - key: NEXT_PUBLIC_API_URL
        value: https://api.ats.carvis.ai
      - key: OPENATS_API_URL
        value: https://api.ats.carvis.ai
